<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f3ede2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#42372c" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 紙の縁取り枠線（上品な和の余白） -->
  <rect x="40" y="40" width="1120" height="550" rx="32" fill="none" stroke="#e0d6c5" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="52" y="52" width="1096" height="526" rx="24" fill="none" stroke="#ebe4d5" stroke-width="1.5"/>

  <!-- 左側：メインタイトルエリア -->
  <g transform="translate(110, 150)">
    <!-- 朱色の落款印章ロゴ -->
    <rect x="0" y="0" width="96" height="96" rx="24" fill="#9a3412" filter="url(#shadow)"/>
    <text x="48" y="66" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">印</text>

    <!-- アプリ名 -->
    <text x="124" y="68" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="76" font-weight="bold" fill="#2b231c" letter-spacing="4">旅印</text>
    <text x="310" y="40" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="22" font-weight="bold" fill="#8c7864" letter-spacing="3">たびじるし</text>

    <!-- キャッチコピー -->
    <text x="0" y="170" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="34" font-weight="bold" fill="#42372c" letter-spacing="2">
      旅先で出会った紙の記憶を、
    </text>
    <text x="0" y="225" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="34" font-weight="bold" fill="#9a3412" letter-spacing="2">
      あなたの日本地図に。
    </text>

    <!-- サブテキスト -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="460" height="48" rx="24" fill="#ffffff" stroke="#ddd0b8" stroke-width="1.5"/>
      <text x="24" y="31" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="18" font-weight="bold" fill="#6b5b4d">
        🗾 スタンプ・半券・チケットの 47都道府県 記録帖
      </text>
    </g>
  </g>

  <!-- 右側：日本地図とコレクションカードのビジュアル -->
  <g transform="translate(740, 110)">
    <!-- カード1：スタンプカード風 -->
    <g transform="translate(40, 40) rotate(-6)" filter="url(#shadow)">
      <rect width="280" height="340" rx="24" fill="#ffffff" stroke="#ddd0b8" stroke-width="2"/>
      <rect x="20" y="20" width="240" height="220" rx="16" fill="#f5f2eb"/>
      <circle cx="140" cy="130" r="75" fill="#9a3412" fill-opacity="0.1" stroke="#9a3412" stroke-width="5" stroke-dasharray="10 6"/>
      <circle cx="140" cy="130" r="62" fill="none" stroke="#9a3412" stroke-width="2"/>
      <text x="140" y="125" font-family="'Hiragino Mincho ProN', serif" font-size="28" font-weight="bold" fill="#9a3412" text-anchor="middle">登頂記念</text>
      <text x="140" y="155" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="16" font-bold" fill="#9a3412" text-anchor="middle">富士山頂</text>
      <text x="24" y="280" font-family="'Hiragino Mincho ProN', serif" font-size="18" font-weight="bold" fill="#2b231c">富士山 頂上社</text>
      <text x="24" y="308" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="14" fill="#8c7864">静岡県富士宮市 • 2026/08/11</text>
    </g>

    <!-- カード2：日本地図バッジ -->
    <g transform="translate(140, 180) rotate(8)" filter="url(#shadow)">
      <rect width="220" height="150" rx="20" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
      <text x="30" y="45" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f">訪問達成度</text>
      <text x="30" y="98" font-family="'Hiragino Mincho ProN', serif" font-size="44" font-weight="bold" fill="#1b4332">18</text>
      <text x="95" y="98" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="18" font-weight="bold" fill="#8c7864">/ 47 都道府県</text>
      <rect x="30" y="118" width="160" height="10" rx="5" fill="#e8f0ec"/>
      <rect x="30" y="118" width="62" height="10" rx="5" fill="#2d6a4f"/>
    </g>
  </g>
</svg>
